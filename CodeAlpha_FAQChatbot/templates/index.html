<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Chatbot | CodeAlpha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="app">
        <header class="header">
            <div class="bot-icon">✦</div>
            <div>
                <h1>FAQ Assistant</h1>
                <p><span class="status"></span> Online · Ready to help</p>
            </div>
        </header>

        <section class="chat" id="chat">
            <div class="message bot">
                <div class="avatar">✦</div>
                <div class="bubble">
                    Hi! 👋 I'm your FAQ assistant. Ask me anything about
                    accounts, support, working hours, or registration.
                </div>
            </div>
        </section>

        <div class="suggestions">
            <button type="button" onclick="askSuggestion('What is your name?')">Who are you?</button>
            <button type="button" onclick="askSuggestion('How do I reset my password?')">Reset password</button>
            <button type="button" onclick="askSuggestion('What are your working hours?')">Working hours</button>
        </div>

        <form id="chat-form" class="input-area">
            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                autocomplete="off"
                maxlength="1000"
                required
            >
            <button type="submit" id="send">Send ➤</button>
        </form>

        <footer>Powered by Python & Flask · CodeAlpha Task 2</footer>
    </main>

    <script>
        const chat = document.getElementById("chat");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("question");
        const sendButton = document.getElementById("send");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = `message ${type}`;

            const avatar = document.createElement("div");
            avatar.className = "avatar";
            avatar.textContent = type === "bot" ? "✦" : "You";

            const bubble = document.createElement("div");
            bubble.className = "bubble";
            bubble.textContent = text;

            message.append(avatar, bubble);
            chat.appendChild(message);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendQuestion(question) {
            const cleanQuestion = question.trim();
            if (!cleanQuestion || sendButton.disabled) return;

            addMessage(cleanQuestion, "user");
            input.value = "";
            sendButton.disabled = true;
            sendButton.textContent = "…";

            try {
                const response = await fetch("/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: cleanQuestion })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.answer || "Request failed.");
                }

                addMessage(data.answer, "bot");
            } catch (error) {
                addMessage(
                    "Sorry, something went wrong. Please try again.",
                    "bot"
                );
                console.error(error);
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = "Send ➤";
                input.focus();
            }
        }

        form.addEventListener("submit", function(event) {
            event.preventDefault();
            sendQuestion(input.value);
        });

        function askSuggestion(question) {
            sendQuestion(question);
        }
    </script>
</body>
</html>
